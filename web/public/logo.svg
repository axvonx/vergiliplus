<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="vergiliplus">
  <!-- Site logo: Earth's interior fully opened (no crust): mantle with convection,
       liquid outer core, solid inner core. Stylized proportions (cores enlarged).
       The tab icon (favicon.svg) is the same idea in an octagon. -->
  <defs>
    <radialGradient id="mantle" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#ff3b26"/>
      <stop offset="1" stop-color="#b8161a"/>
    </radialGradient>
    <radialGradient id="outer" cx="50%" cy="50%" r="50%">
      <stop offset="0.45" stop-color="#ffc04a"/>
      <stop offset="1" stop-color="#ff9a12"/>
    </radialGradient>
    <radialGradient id="inner" cx="42%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.6" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffc12b"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#mantle)" stroke="#0b1a33" stroke-width="3"/>
  <g fill="none" stroke="#ffb27a" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round">
    <path d="M11 24 A22 22 0 0 1 24 10.5"/>
    <path d="M53 40 A22 22 0 0 1 40 53.5"/>
    <path d="M44 9.5 A24 24 0 0 1 55 21"/>
    <path d="M20 54.5 A24 24 0 0 1 9 43"/>
  </g>
  <circle cx="32" cy="32" r="19" fill="url(#outer)" stroke="#a5230f" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="9.5" fill="url(#inner)"/>
</svg>
